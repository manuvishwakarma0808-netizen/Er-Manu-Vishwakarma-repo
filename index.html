<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manu Vishwakarma | Civil Engineer</title>
  <meta name="description" content="Portfolio of Manu Vishwakarma, civil engineer: experience, projects and AutoCAD drawings.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="nav">
    <a class="brand" href="#top" id="brand"></a>
    <nav>
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#drawings">Drawings</a>
      <a href="#skills">Skills</a>
      <a href="#education">Education</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero wrap">
      <p class="eyebrow" id="hero-title"></p>
      <h1 id="hero-name"></h1>
      <p class="lead" id="hero-summary"></p>
      <div class="actions">
        <a class="btn primary" href="#drawings">View drawings</a>
        <a class="btn" id="cv-btn" href="#" download>Download CV</a>
      </div>
      <ul class="stats" id="stats"></ul>
    </section>

    <section id="experience" class="wrap"><h2>Experience</h2><div id="experience-list" class="timeline"></div></section>
    <section id="projects" class="wrap"><h2>Projects</h2><div id="projects-list" class="cards"></div></section>

    <section id="drawings" class="wrap">
      <h2>Drawings</h2>
      <p class="muted" id="drawings-intro"></p>
      <div id="gallery" class="gallery"></div>
      <p class="cad" id="cad"></p>
    </section>

    <section id="skills" class="wrap"><h2>Skills</h2><div id="skills-list" class="skills"></div></section>
    <section id="education" class="wrap"><h2>Education</h2><div id="education-list" class="edu"></div></section>

    <section id="contact" class="wrap contact">
      <h2>Contact</h2>
      <p class="lead">Open to site engineering and construction management roles.</p>
      <ul id="contact-list"></ul>
    </section>
  </main>

  <footer class="wrap foot"><span id="footer-text"></span></footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-nav prev" id="lb-prev" aria-label="Previous drawing">&#8249;</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-nav next" id="lb-next" aria-label="Next drawing">&#8250;</button>
  </div>

  <noscript><p style="padding:2rem;text-align:center">Please enable JavaScript to view this portfolio.</p></noscript>

  <script src="content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
